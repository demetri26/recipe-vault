<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecipeVault</title>
  <meta name="description" content="Your personal offline recipe vault" />
  <meta name="theme-color" content="#FF8906" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RecipeVault" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0F0E17;
      color: #FFFFFE;
      font-family: Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #app { position: relative; min-height: 100vh; }

    /* Grain overlay */
    #app::before {
      content: '';
      position: fixed; inset: 0;
      opacity: 0.04; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    .rel { position: relative; z-index: 10; }

    /* Header */
    .header { padding: 24px 20px 0; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 22px; font-weight: bold; }
    .logo span { color: #FF8906; }
    .add-btn {
      background: #FF8906; border: none; color: #0F0E17;
      border-radius: 50px; padding: 10px 20px;
      font-family: Georgia, serif; font-weight: bold; font-size: 14px;
      cursor: pointer; box-shadow: 0 4px 20px rgba(255,137,6,0.4);
    }
    .add-btn:active { opacity: 0.85; }

    /* Search */
    .search-row { padding: 20px 20px 0; }
    .search-input {
      width: 100%; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      padding: 12px 16px; color: #FFFFFE;
      font-family: Georgia, serif; font-size: 15px; outline: none;
    }
    .search-input::placeholder { color: #A7A9BE; }

    /* Category chips */
    .cat-row { display: flex; gap: 8px; overflow-x: auto; padding: 16px 20px 0; scrollbar-width: none; }
    .cat-row::-webkit-scrollbar { display: none; }
    .cat-chip {
      padding: 6px 14px; border-radius: 50px; border: none;
      background: rgba(255,255,255,0.08); color: #A7A9BE;
      font-family: Georgia, serif; font-size: 13px; cursor: pointer; white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-chip.active { color: #0F0E17; font-weight: bold; }

    /* Grid */
    .grid {
      padding: 20px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px;
    }
    .card {
      background: rgba(255,255,255,0.05); border-radius: 16px;
      padding: 20px 16px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.07); transition: background 0.2s;
    }
    .card:hover, .card:active { background: rgba(255,255,255,0.09); }
    .card-emoji { font-size: 36px; margin-bottom: 10px; }
    .card-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; line-height: 1.3; }
    .card-meta { font-size: 12px; color: #A7A9BE; }
    .cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .card-time { margin-top: 4px; }
    .recipe-count { text-align: center; padding: 8px 0 24px; color: rgba(255,255,255,0.2); font-size: 12px; }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: #A7A9BE; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: bold; color: #FFFFFE; margin-bottom: 8px; }

    /* Back button */
    .back-btn {
      background: none; border: none; color: #FF8906;
      font-family: Georgia, serif; font-size: 14px; cursor: pointer;
      padding: 24px 20px 0; display: block;
    }

    /* Detail */
    .detail-wrap { padding: 16px 20px 40px; }
    .detail-emoji { font-size: 60px; margin-bottom: 10px; }
    .detail-title { font-size: 28px; font-weight: bold; margin-bottom: 6px; line-height: 1.2; }
    .detail-meta { display: flex; gap: 16px; color: #A7A9BE; font-size: 13px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; color: #FF8906; margin-bottom: 10px; }
    .ingredient-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); color: #E8E8F0; font-size: 15px; }
    .step-item { display: flex; gap: 12px; margin-bottom: 14px; }
    .step-num { color: #FF8906; font-weight: bold; font-size: 18px; min-width: 24px; }
    .step-text { color: #E8E8F0; line-height: 1.6; font-size: 15px; }
    .note-box { background: rgba(255,137,6,0.08); border: 1px solid rgba(255,137,6,0.2); border-radius: 10px; padding: 14px; color: #E8E8F0; font-size: 14px; line-height: 1.6; }
    .action-row { display: flex; gap: 10px; margin-top: 28px; }
    .edit-btn { flex: 1; background: rgba(255,255,255,0.08); border: none; color: #FFFFFE; border-radius: 10px; padding: 13px; font-family: Georgia, serif; font-size: 15px; cursor: pointer; }
    .delete-btn { flex: 1; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #EF4444; border-radius: 10px; padding: 13px; font-family: Georgia, serif; font-size: 15px; cursor: pointer; }

    /* Form */
    .form-wrap { padding: 16px 20px 60px; }
    .form-title { font-size: 22px; font-weight: bold; margin-bottom: 24px; }
    label.field-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #FF8906; display: block; margin-bottom: 6px; font-weight: bold; }
    input.field, select.field {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 12px 14px; color: #FFFFFE;
      font-family: Georgia, serif; font-size: 15px; outline: none; margin-bottom: 18px;
    }
    select.field { background: #1A1929; }
    textarea.field {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 12px 14px; color: #FFFFFE;
      font-family: Georgia, serif; font-size: 15px; outline: none; resize: vertical; min-height: 80px; margin-bottom: 18px;
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .list-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .list-input-row input, .list-input-row textarea { flex: 1; margin-bottom: 0; }
    .remove-btn { background: rgba(239,68,68,0.15); border: none; color: #EF4444; border-radius: 8px; width: 36px; cursor: pointer; font-size: 18px; flex-shrink: 0; }
    .add-item-btn { background: none; border: 1px dashed rgba(255,255,255,0.2); color: #A7A9BE; border-radius: 8px; padding: 8px 14px; font-family: Georgia, serif; font-size: 13px; cursor: pointer; margin-bottom: 18px; display: block; }
    .save-btn { width: 100%; background: #FF8906; border: none; color: #0F0E17; border-radius: 12px; padding: 15px; font-family: Georgia, serif; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 20px rgba(255,137,6,0.4); }
    .emoji-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .emoji-btn { font-size: 24px; background: rgba(255,255,255,0.06); border: 2px solid transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; }
    .emoji-btn.active { background: rgba(255,137,6,0.3); border-color: #FF8906; }

    /* Modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: #1A1929; border-radius: 16px; padding: 28px; max-width: 340px; width: 100%; text-align: center; }
    .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .modal-text { color: #A7A9BE; margin-bottom: 24px; line-height: 1.5; }
    .modal-btns { display: flex; gap: 10px; }
    .cancel-btn { flex: 1; background: rgba(255,255,255,0.08); border: none; color: #FFFFFE; border-radius: 10px; padding: 12px; font-family: Georgia, serif; cursor: pointer; }
    .confirm-btn { flex: 1; background: #EF4444; border: none; color: #fff; border-radius: 10px; padding: 12px; font-family: Georgia, serif; font-weight: bold; cursor: pointer; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #fff; border-radius: 50px; padding: 12px 24px;
      font-family: Georgia, serif; font-size: 14px; font-weight: bold;
      z-index: 200; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      pointer-events: none; white-space: nowrap;
      opacity: 0; transition: opacity 0.3s;
    }
    #toast.show { opacity: 1; }

    /* View management */
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>
<div id="app">

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- DELETE MODAL -->
  <div id="delete-modal" class="overlay" style="display:none;">
    <div class="modal">
      <div class="modal-title">Delete Recipe?</div>
      <div class="modal-text" id="delete-modal-text"></div>
      <div class="modal-btns">
        <button class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
        <button class="confirm-btn" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="view-list" class="view active rel">
    <div class="header">
      <div class="logo">Recipe<span>Vault</span></div>
      <button class="add-btn" onclick="startAdd()">+ Add Recipe</button>
    </div>
    <div class="search-row">
      <input class="search-input" id="search-input" placeholder="🔍  Search recipes..." oninput="renderList()" />
    </div>
    <div class="cat-row" id="cat-row"></div>
    <div class="grid" id="recipe-grid"></div>
    <div class="recipe-count" id="recipe-count"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="view-detail" class="view rel">
    <button class="back-btn" onclick="showView('list')">← Back to Vault</button>
    <div class="detail-wrap" id="detail-content"></div>
  </div>

  <!-- FORM VIEW -->
  <div id="view-form" class="view rel">
    <button class="back-btn" id="form-back-btn">← Cancel</button>
    <div class="form-wrap">
      <div class="form-title" id="form-title">New Recipe</div>

      <label class="field-label">Emoji Icon</label>
      <div class="emoji-picker" id="emoji-picker"></div>
      <input type="hidden" id="f-emoji" value="🍽️" />
      <input type="hidden" id="f-id" value="" />

      <label class="field-label">Recipe Name *</label>
      <input class="field" id="f-title" placeholder="e.g. Lemon Risotto" />

      <div class="two-col">
        <div>
          <label class="field-label">Category</label>
          <select class="field" id="f-category"></select>
        </div>
        <div>
          <label class="field-label">Cook Time</label>
          <input class="field" id="f-time" placeholder="e.g. 30 min" />
        </div>
      </div>

      <label class="field-label">Servings</label>
      <input class="field" id="f-servings" type="number" min="1" placeholder="e.g. 4" />

      <label class="field-label">Ingredients</label>
      <div id="ingredients-list"></div>
      <button class="add-item-btn" onclick="addListItem('ingredients')">+ Add Ingredient</button>

      <label class="field-label">Steps</label>
      <div id="steps-list"></div>
      <button class="add-item-btn" onclick="addListItem('steps')">+ Add Step</button>

      <label class="field-label">Chef's Notes</label>
      <textarea class="field" id="f-notes" placeholder="Tips, substitutions, variations..."></textarea>

      <button class="save-btn" onclick="saveForm()">Save Recipe 🍽️</button>
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = 'recipe_vault_data';
const CATEGORIES = ['Breakfast','Lunch','Dinner','Pasta','Dessert','Snack','Soup','Salad','Other'];
const CAT_COLORS = {Breakfast:'#F59E0B',Lunch:'#10B981',Dinner:'#6366F1',Pasta:'#EF4444',Dessert:'#EC4899',Snack:'#8B5CF6',Soup:'#F97316',Salad:'#14B8A6',Other:'#64748B'};
const EMOJIS = ['🍝','🥑','🍳','🥗','🍜','🍲','🥘','🍕','🫕','🥩','🍗','🫔','🥪','🍱','🍛','🍣','🥧','🍰','🧁','🍩','🍪','☕','🍵','🥤','🍽️'];

const DEFAULT_RECIPES = [
  {id:1,title:'Classic Carbonara',category:'Pasta',time:'25 min',servings:2,emoji:'🍝',
   ingredients:['200g spaghetti','100g pancetta','2 eggs','50g Pecorino Romano','Black pepper'],
   steps:['Cook pasta in salted water.','Fry pancetta until crisp.','Whisk eggs with cheese and pepper.','Combine hot pasta with pancetta, remove from heat, add egg mixture and toss quickly.'],
   notes:"Don't add cream — the creaminess comes from eggs and cheese!"},
  {id:2,title:'Avocado Toast',category:'Breakfast',time:'10 min',servings:1,emoji:'🥑',
   ingredients:['2 slices sourdough','1 avocado','Lemon juice','Chili flakes','Salt & pepper'],
   steps:['Toast bread until golden.','Mash avocado with lemon, salt, and pepper.','Spread on toast and top with chili flakes.'],
   notes:'Add a poached egg on top for extra protein.'}
];

let recipes = [];
let currentId = null;
let filterCat = 'All';
let formMode = 'add';
let toastTimer = null;

// ---- Storage ----
function loadRecipes() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch {}
  return DEFAULT_RECIPES;
}
function saveRecipes() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes)); } catch {}
}

// ---- Toast ----
function showToast(msg, color='#10B981') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ---- Views ----
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  window.scrollTo(0,0);
  if (name === 'list') renderList();
}

// ---- Category chips ----
function renderCatRow() {
  const row = document.getElementById('cat-row');
  const allCats = ['All', ...CATEGORIES];
  row.innerHTML = allCats.map(cat => {
    const active = filterCat === cat;
    const bg = active ? (cat==='All' ? '#FF8906' : (CAT_COLORS[cat]||'#64748B')) : 'rgba(255,255,255,0.08)';
    const color = active ? '#0F0E17' : '#A7A9BE';
    const fw = active ? 'bold' : 'normal';
    return `<button class="cat-chip${active?' active':''}" style="background:${bg};color:${color};font-weight:${fw}" onclick="setCat('${cat}')">${cat}</button>`;
  }).join('');
}
function setCat(cat) { filterCat = cat; renderList(); }

// ---- List ----
function renderList() {
  renderCatRow();
  const search = document.getElementById('search-input').value.toLowerCase();
  const filtered = recipes.filter(r => {
    const matchCat = filterCat === 'All' || r.category === filterCat;
    const matchSearch = r.title.toLowerCase().includes(search) || r.category.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });
  const grid = document.getElementById('recipe-grid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🫙</div><div class="empty-title">Your vault is empty</div><div>Add your first recipe to get started!</div></div>`;
  } else {
    grid.innerHTML = filtered.map(r => {
      const dotColor = CAT_COLORS[r.category] || '#64748B';
      return `<div class="card" onclick="openRecipe(${r.id})">
        <div class="card-emoji">${r.emoji}</div>
        <div class="card-title">${esc(r.title)}</div>
        <div class="card-meta">
          <span class="cat-dot" style="background:${dotColor}"></span>${esc(r.category)}
          ${r.time ? `<div class="card-time">⏱ ${esc(r.time)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('recipe-count').textContent = `${recipes.length} recipe${recipes.length!==1?'s':''} stored offline`;
}

// ---- Detail ----
function openRecipe(id) {
  currentId = id;
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const dotColor = CAT_COLORS[r.category] || '#64748B';
  let html = `
    <div class="detail-emoji">${r.emoji}</div>
    <div class="detail-title">${esc(r.title)}</div>
    <div class="detail-meta">
      <span><span class="cat-dot" style="background:${dotColor}"></span>${esc(r.category)}</span>
      ${r.time ? `<span>⏱ ${esc(r.time)}</span>` : ''}
      ${r.servings ? `<span>🍽 ${esc(String(r.servings))} servings</span>` : ''}
    </div>`;

  if (r.ingredients && r.ingredients.length) {
    html += `<div class="section"><div class="section-title">Ingredients</div>${r.ingredients.map(i=>`<div class="ingredient-item">· ${esc(i)}</div>`).join('')}</div>`;
  }
  if (r.steps && r.steps.length) {
    html += `<div class="section"><div class="section-title">Method</div>${r.steps.map((s,i)=>`<div class="step-item"><span class="step-num">${i+1}.</span><span class="step-text">${esc(s)}</span></div>`).join('')}</div>`;
  }
  if (r.notes) {
    html += `<div class="section"><div class="section-title">Chef's Notes</div><div class="note-box">💡 ${esc(r.notes)}</div></div>`;
  }
  html += `<div class="action-row">
    <button class="edit-btn" onclick="startEdit()">✏️ Edit</button>
    <button class="delete-btn" onclick="openDeleteModal()">🗑 Delete</button>
  </div>`;
  document.getElementById('detail-content').innerHTML = html;
  showView('detail');
}

// ---- Delete ----
function openDeleteModal() {
  const r = recipes.find(x => x.id === currentId);
  document.getElementById('delete-modal-text').textContent = `"${r?.title}" will be permanently removed from your vault.`;
  document.getElementById('delete-modal').style.display = 'flex';
}
function closeDeleteModal() { document.getElementById('delete-modal').style.display = 'none'; }
function confirmDelete() {
  recipes = recipes.filter(r => r.id !== currentId);
  saveRecipes(); closeDeleteModal(); showView('list');
  showToast('Recipe deleted', '#EF4444');
}

// ---- Form ----
function buildEmojiPicker(selected) {
  document.getElementById('emoji-picker').innerHTML = EMOJIS.map(e =>
    `<button type="button" class="emoji-btn${e===selected?' active':''}" onclick="selectEmoji('${e}')">${e}</button>`
  ).join('');
}
function selectEmoji(e) {
  document.getElementById('f-emoji').value = e;
  document.querySelectorAll('.emoji-btn').forEach(b => b.classList.toggle('active', b.textContent===e));
}
function buildCatSelect(selected) {
  document.getElementById('f-category').innerHTML = CATEGORIES.map(c =>
    `<option value="${c}"${c===selected?' selected':''}>${c}</option>`
  ).join('');
}

function startAdd() {
  formMode = 'add';
  document.getElementById('form-title').textContent = 'New Recipe';
  document.getElementById('form-back-btn').onclick = () => showView('list');
  document.getElementById('f-id').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-time').value = '';
  document.getElementById('f-servings').value = '2';
  document.getElementById('f-notes').value = '';
  buildEmojiPicker('🍽️');
  buildCatSelect('Other');
  renderDynamicList('ingredients', ['']);
  renderDynamicList('steps', ['']);
  document.querySelector('.save-btn').textContent = 'Save Recipe 🍽️';
  showView('form');
}

function startEdit() {
  const r = recipes.find(x => x.id === currentId);
  if (!r) return;
  formMode = 'edit';
  document.getElementById('form-title').textContent = 'Edit Recipe';
  document.getElementById('form-back-btn').onclick = () => showView('detail');
  document.getElementById('f-id').value = r.id;
  document.getElementById('f-title').value = r.title;
  document.getElementById('f-time').value = r.time || '';
  document.getElementById('f-servings').value = r.servings || '';
  document.getElementById('f-notes').value = r.notes || '';
  buildEmojiPicker(r.emoji || '🍽️');
  buildCatSelect(r.category);
  renderDynamicList('ingredients', r.ingredients.length ? r.ingredients : ['']);
  renderDynamicList('steps', r.steps.length ? r.steps : ['']);
  document.querySelector('.save-btn').textContent = 'Update Recipe ✓';
  showView('form');
}

function renderDynamicList(field, items) {
  const container = document.getElementById(field + '-list');
  container.innerHTML = items.map((val, i) => {
    const isTA = field === 'steps';
    const input = isTA
      ? `<textarea class="field" style="margin-bottom:0;min-height:60px;flex:1" data-field="${field}" data-index="${i}" placeholder="Step ${i+1}">${esc(val)}</textarea>`
      : `<input class="field" style="margin-bottom:0;flex:1" data-field="${field}" data-index="${i}" placeholder="Ingredient ${i+1}" value="${escAttr(val)}" />`;
    const removeBtn = items.length > 1 ? `<button type="button" class="remove-btn" onclick="removeListItem('${field}',${i})">×</button>` : '';
    return `<div class="list-input-row">${input}${removeBtn}</div>`;
  }).join('');
}

function getListValues(field) {
  return [...document.querySelectorAll(`[data-field="${field}"]`)].map(el => el.value);
}

function addListItem(field) {
  const vals = getListValues(field);
  vals.push('');
  renderDynamicList(field, vals);
}

function removeListItem(field, index) {
  const vals = getListValues(field);
  vals.splice(index, 1);
  renderDynamicList(field, vals);
}

function saveForm() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('Please enter a recipe title', '#EF4444'); return; }
  const recipe = {
    id: formMode === 'edit' ? parseInt(document.getElementById('f-id').value) : Date.now(),
    title,
    category: document.getElementById('f-category').value,
    time: document.getElementById('f-time').value.trim(),
    servings: document.getElementById('f-servings').value,
    emoji: document.getElementById('f-emoji').value,
    ingredients: getListValues('ingredients').filter(x => x.trim()),
    steps: getListValues('steps').filter(x => x.trim()),
    notes: document.getElementById('f-notes').value.trim(),
  };
  if (formMode === 'add') {
    recipes.push(recipe);
    showToast('Recipe saved! 🎉');
  } else {
    recipes = recipes.map(r => r.id === recipe.id ? recipe : r);
    showToast('Recipe updated!');
  }
  saveRecipes();
  currentId = recipe.id;
  openRecipe(recipe.id);
}

// ---- Helpers ----
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return String(str||'').replace(/"/g,'&quot;');
}

// ---- Init ----
recipes = loadRecipes();
renderList();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
